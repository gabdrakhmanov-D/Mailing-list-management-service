{% extends 'main/base.html' %}

{% block title %}Авторизация{% endblock %}

{% block head_description %}
Авторизация
{% endblock %}

{% block content %}

<form class="row g-3 position-relative py-2 px-4 text-bg-dark border rounded-2 mt-5 bg-secondary top-0 start-50 translate-middle-x"
      style="width: 25%" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Войти</button>
    <div class="row text-center mt-2">
        <div class="col">
        <a class="btn text-light" href="{% url 'users:register' %}">Регистрация</a></div>
        <div class="col">
        <a class="btn text-warning" href="{% url 'users:password_reset' %}">Забыли пароль?</a></div></div>
</form>

{% endblock %}
