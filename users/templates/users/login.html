{% extends 'users/base.html' %}

{% block title %}Авторизация{% endblock %}

{% block head_description %}
Авторизация
{% endblock %}

{% block content %}
{% include 'users\header.html' %}

<form class="row g-3 position-relative py-2 px-4 text-bg-dark border rounded-2 mt-5 bg-secondary top-0 start-50 translate-middle-x"
      style="width: 25%" method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Войти</button>
    <a class="btn" href="{% url 'users:password_reset' %}">Забыли пароль?</a>
</form>

{% endblock %}
