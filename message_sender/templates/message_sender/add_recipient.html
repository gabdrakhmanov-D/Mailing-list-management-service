{% extends 'message_sender/base.html' %}

{% block title %}Добавить получателя{% endblock %}

{% block content %}
{% include 'message_sender/header.html' %}

<form action="" method="POST" class="position-absolute top-50 start-50 translate-middle border border-success rounded bg-warning-subtle" style="width: 25%;">
    {% csrf_token %}
    <div class="mb-3 mt-3 px-4">
        <label for="{{ form.fullname.id_for_label }}" class="form-label">{{ form.fullname.label }}</label>
        <input type="text" class="form-control" id="{{ form.fullname.id_for_label }}" name="{{ form.fullname.name }}">
    </div>
    <div class="mb-3 px-4">
        <label for="basic-addon1" class="form-label">{{ form.email.label }}</label>
        <div class="input-group">
            <span class="input-group-text" id="basic-addon1">@</span>
            <input type="email" class="form-control" aria-describedby="basic-addon1"
                   name="{{ form.email.name }}">
        </div>
    </div>
    <div class="mb-3 px-4">
        <label for="{{ form.comment.id_for_label }}" class="form-label">{{ form.comment.label }}</label>
        <textarea class="form-control" id="{{ form.comment.id_for_label }}" rows="3"
                  name="{{ form.comment.name }}"></textarea>
    </div>
        <div class="mb-3 mt-3 px-4 align-items-middle">

    <button type="submit" class="btn btn-primary mb-2 px-4">Отправить</button>
    <a href="{% url 'sender:recipients' %}" class="btn btn-primary mb-2 px-4">Отмена</a>
    </div>

</form>

{% endblock %}
