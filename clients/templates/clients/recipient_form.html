{% extends 'main/base.html' %}

{% block title %}
{% if object %}
Редактировать получателя
{% else %}
Создать получателя
{% endif %}
{% endblock %}

{% block content %}

<form action="" method="POST"
      class="position-absolute top-50 start-50 translate-middle border border-success rounded bg-warning-subtle"
      style="width: 25%;">
    {% csrf_token %}
    <div class="form-error">{{ form.errors }}</div>
    <div class="mb-3 mt-3 px-4">
        <label for="{{ form.fullname.id_for_label }}" class="form-label">{{ form.fullname.label }}</label>
        <input type="text" class="form-control" id="{{ form.fullname.id_for_label }}" name="{{ form.fullname.name }}"
                           value="{% if object %}{{ form.fullname.value }}{% endif %}"></div>
    <div class="mb-3 px-4">
        <label for="basic-addon1" class="form-label">{{ form.email.label }}</label>
        <div class="input-group">
            <span class="input-group-text" id="basic-addon1">@</span>
            <input type="email" class="form-control" aria-describedby="basic-addon1"
                   name="{{ form.email.name }}" value="{% if object %}{{ form.email.value }}{% endif %}">
        </div>
    </div>
    <div class="mb-3 px-4">
        <label for="{{ form.comment.id_for_label }}" class="form-label">{{ form.comment.label }}</label>
        <textarea class="form-control" id="{{ form.comment.id_for_label }}" rows="3"
                  name="{{ form.comment.name }}">{% if object %}{{ form.comment.value }}{% endif %}</textarea>
    </div>
    <div class="d-grid col-6 mx-auto">
        <button type="submit" class="btn btn-success mb-2 px-4">
            {% if object %}
            Сохранить
            {% else %}
            Создать
            {% endif %}
        </button>
        <a href="{% url 'clients:recipients' %}" class="btn btn-primary mb-2 px-4">Отмена</a>
    </div>

</form>

{% endblock %}
